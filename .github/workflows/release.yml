name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag da release (ex: v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Release Tag
        id: vars
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v1.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compress databases and generate manifest
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          python scripts/compress_and_manifest.py --tag "${{ steps.vars.outputs.tag }}"

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          files: |
            dist/*.sqlite.gz
            dist/manifest.json
          fail_on_unmatched_files: true
